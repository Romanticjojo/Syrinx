# romanticjojo.com → Syrinx 静态站（nginx 配置快照，2026-09-06 优化版）
# 应用方式：合并进服务器的 /etc/nginx/sites-enabled/proxy
# （该文件还承载 alnazar.me 的配置，Syrinx 块单独维护，不要整文件覆盖）
#
# 要点：
# - HTTP/2 多路复用
# - ACME 直通：SPA fallback 会吞 /.well-known/acme-challenge/ 导致证书续期失败
# - 伴奏内容协商：URL 是 .mp3 但优先吐同目录 .m4a（AAC 96k）
# - gzip 只压文本类（mp3/mp4 图片压了反而费 CPU）

# ── HTTP：仅跳转 + ACME 验证 ──
server {
    listen 80;
    server_name romanticjojo.com www.romanticjojo.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS：Syrinx 静态站 ──
server {
    listen 443 ssl http2;
    server_name romanticjojo.com www.romanticjojo.com;

    ssl_certificate /etc/letsencrypt/live/romanticjojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/romanticjojo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RJ_SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/syrinx;
    index index.html;

    sendfile on;
    tcp_nopush on;

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    # 伴奏内容协商：URL 仍是 .mp3，但服务器有同名 .m4a（AAC 96k，体积-70%）时优先吐它
    location ~ ^/songs/([^/]+)/accompaniment\.mp3$ {
        root /var/www/syrinx;
        try_files /songs/$1/accompaniment.m4a /songs/$1/accompaniment.mp3 =404;
        types { } default_type audio/mp4;
        expires 7d;
    }
    location /songs/ { expires 7d; }
    location /brand/ { expires 7d; }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
