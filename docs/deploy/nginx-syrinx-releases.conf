# Syrinx R1 versioned-resource snippet.
#
# Manually add these locations inside ONLY the romanticjojo.com 443 server and
# the Syrinx 8090 server in /etc/nginx/sites-enabled/proxy and
# /etc/nginx/sites-enabled/syrinx. Keep each server's existing
# `root /var/www/syrinx;`, ACME location, certificates, and SPA fallback.
# Do not copy this file over either live config: the shared proxy file also
# serves Alnazar.

# Immutable resources. A missing file is a real 404; there is no SPA fallback
# inside this prefix. Use a private copy of the normal MIME map with m4a mapped
# to audio/mp4 (Ubuntu's stock table uses audio/x-m4a). See DEPLOY-WEB.md.
location ^~ /releases/ {
    alias /var/www/syrinx-releases/;
    include /etc/nginx/snippets/syrinx-mime.types;
    autoindex off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# The mutable entry point must revalidate. The release script atomically
# replaces only /var/www/syrinx/index.html on the same filesystem.
location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
