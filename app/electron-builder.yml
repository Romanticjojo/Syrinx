# electron-builder 配置 — Syrinx Windows 打包
appId: app.syrinx.desktop
productName: Syrinx
copyright: Syrinx

directories:
  output: release
  buildResources: electron/build

files:
  - electron/main.cjs
  - dist/**/*

# Vite 构建产物作为静态资源直接打进 asar
extraMetadata:
  main: electron/main.cjs

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: electron/build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: Syrinx

# 用 file: 协议加载 dist，无需本地 server
